<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מבחן בטיחות בעבודה - חוק ארגון הפיקוח על העבודה</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-hover: #1e40af;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --border: #cbd5e1;
            --correct: #16a34a;
            --correct-bg: #f0fdf4;
            --incorrect: #dc2626;
            --incorrect-bg: #fef2f2;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 800px;
            padding: 30px;
            border: 1px solid var(--border);
        }

        h1 {
            color: var(--primary);
            margin-top: 0;
            text-align: center;
            font-size: 1.6rem;
            border-bottom: 2px solid var(--border);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .progress {
            font-size: 0.95rem;
            color: #64748b;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .question-box {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        .option-btn {
            background-color: #ffffff;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            padding: 14px 18px;
            text-align: right;
            font-size: 1.05rem;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text);
            line-height: 1.4;
        }

        .option-btn:hover:not(:disabled) {
            background-color: #f1f5f9;
            border-color: #94a3b8;
        }

        .option-btn.selected {
            border-color: var(--primary);
            background-color: #eff6ff;
            font-weight: 600;
        }

        button.action-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-size: 1.05rem;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
            width: 100%;
        }

        button.action-btn:hover {
            background-color: var(--primary-hover);
        }

        button.action-btn:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        .feedback {
            padding: 18px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 1rem;
            line-height: 1.6;
        }

        .feedback.correct {
            background-color: var(--correct-bg);
            color: #14532d;
            border: 1.5px solid #bbf7d0;
        }

        .feedback.incorrect {
            background-color: var(--incorrect-bg);
            color: #7f1d1d;
            border: 1.5px solid #fecaca;
        }

        .explanation {
            margin-top: 8px;
            font-weight: normal;
            font-size: 0.95rem;
        }

        .summary-box {
            text-align: center;
            padding: 20px 0;
        }

        .score-display {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--primary);
            margin: 20px 0;
        }

        .results-details {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin: 25px 0;
            font-size: 1.2rem;
        }

        .results-details .correct-text { color: var(--correct); font-weight: bold; }
        .results-details .incorrect-text { color: var(--incorrect); font-weight: bold; }

        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>מבחן הסמכה: חוק ארגון הפיקוח על העבודה, תשי"ד-1954</h1>

    <!-- מסך שאלות -->
    <div id="quiz-screen">
        <div class="progress" id="progress-text">שאלה 1 מתוך 20</div>
        <div class="question-box" id="question-text"></div>
        <div class="options" id="options-container"></div>
        
        <button id="submit-btn" class="action-btn" onclick="submitAnswer()" disabled>אשר תשובה</button>
        <button id="next-btn" class="action-btn hidden" onclick="nextQuestion()">לשאלה הבאה</button>

        <div id="feedback-box" class="feedback hidden"></div>
    </div>

    <!-- מסך סיכום -->
    <div id="summary-screen" class="hidden">
        <div class="summary-box">
            <h2>המבחן הושלם!</h2>
            <p>להלן סיכום התוצאות שלך במבחן חוק ארגון הפיקוח על העבודה:</p>
            <div class="score-display" id="final-score">0%</div>
            <div class="results-details">
                <div>תשובות נכונות: <span class="correct-text" id="correct-count">0</span></div>
                <div>תשובות שגויות: <span class="incorrect-text" id="incorrect-count">0</span></div>
            </div>
            <button class="action-btn" onclick="resetQuiz()">התחל מבחן מחדש</button>
        </div>
    </div>
</div>

<script>

            options: [

                "ג' בשעות העבודה הרגילות המקובלות במשק בלבד, ובלבד שהודיע למעסיק 24 שעות מראש",

    let currentQuestionIndex = 0;
    let selectedOption = null;
    let correctAnswersCount = 0;
    let incorrectAnswersCount = 0;

    function showQuestion() {
        const q = questions[currentQuestionIndex];
        document.getElementById('progress-text').innerText = `שאלה ${currentQuestionIndex + 1} מתוך ${questions.length}`;
        document.getElementById('question-text').innerText = q.q;

        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';
        selectedOption = null;

        q.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => selectOption(idx, btn);
            optionsContainer.appendChild(btn);
        });

        document.getElementById('submit-btn').disabled = true;
        document.getElementById('submit-btn').classList.remove('hidden');
        document.getElementById('next-btn').classList.add('hidden');
        document.getElementById('feedback-box').className = 'feedback hidden';
    }

    function selectOption(index, btnElement) {
        selectedOption = index;
        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach(b => b.classList.remove('selected'));
        btnElement.classList.add('selected');
        document.getElementById('submit-btn').disabled = false;
    }

    function submitAnswer() {
        if (selectedOption === null) return;

        const q = questions[currentQuestionIndex];
        const buttons = document.querySelectorAll('.option-btn');
        const feedbackBox = document.getElementById('feedback-box');

        buttons.forEach(b => b.disabled = true);
        document.getElementById('submit-btn').classList.add('hidden');
        document.getElementById('next-btn').classList.remove('hidden');

        const isCorrect = (selectedOption === q.correct);

        if (isCorrect) {
            correctAnswersCount++;
            feedbackBox.className = 'feedback correct';
            feedbackBox.innerHTML = `<strong>תשובה נכונה!</strong><div class="explanation">${q.exp}</div>`;
        } else {
            incorrectAnswersCount++;
            feedbackBox.className = 'feedback incorrect';
            feedbackBox.innerHTML = `<strong>תשובה שגויה.</strong> התשובה הנכונה היא: <strong>${q.options[q.correct]}</strong><div class="explanation">${q.exp}</div>`;
        }

        feedbackBox.classList.remove('hidden');
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < questions.length) {
            showQuestion();
        } else {
            showSummary();
        }
    }

    function showSummary() {
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('summary-screen').classList.remove('hidden');

        document.getElementById('correct-count').innerText = correctAnswersCount;
        document.getElementById('incorrect-count').innerText = incorrectAnswersCount;

        const scorePercent = Math.round((correctAnswersCount / questions.length) * 100);
        document.getElementById('final-score').innerText = `${scorePercent}%`;
    }

    function resetQuiz() {
        currentQuestionIndex = 0;
        correctAnswersCount = 0;
        incorrectAnswersCount = 0;
        document.getElementById('summary-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        showQuestion();
    }

    // הפעלה מיידית בטעינה
    showQuestion();
</script>
