<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">

    <style>
        :root {
            --primary: #1e3a8a;
            --primary-light: #3b82f6;
            --success: #16a34a;
            --error: #dc2626;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 750px;
            padding: 30px;
            border: 1px solid var(--border);
        }

        h1 {
            color: var(--primary);
            font-size: 1.5rem;
            margin-top: 0;
            border-bottom: 2px solid var(--border);
            padding-bottom: 12px;
            text-align: center;
        }

        .header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-weight: 600;
            color: var(--primary-light);
        }

        .question-card {
            margin-bottom: 25px;
        }

        .question-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background-color: #f1f5f9;
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 1rem;
            text-align: right;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text);
            font-family: inherit;
        }

        .option-btn:hover:not(:disabled) {
            background-color: #e2e8f0;
            border-color: var(--primary-light);
        }

        .option-btn:disabled {
            cursor: not-allowed;
        }

        .option-btn.correct {
            background-color: #dcfce7;
            border-color: var(--success);
            color: #14532d;
            font-weight: bold;
        }

        .option-btn.incorrect {
            background-color: #fee2e2;
            border-color: var(--error);
            color: #7f1d1d;
        }

        .feedback-area {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }

        .feedback-area.correct {
            background-color: #f0fdf4;
            border: 1px solid var(--success);
            color: #166534;
        }

        .feedback-area.incorrect {
            background-color: #fef2f2;
            border: 1px solid var(--error);
            color: #991b1b;
        }

        .feedback-title {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .btn-next {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            display: none;
            width: 100%;
            transition: background-color 0.2s;
        }

        .btn-next:hover {
            background-color: var(--primary-light);
        }

        .summary-card {
            display: none;
            text-align: center;
        }

        .summary-score {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--primary);
            margin: 20px 0;
        }

        .summary-details {
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        .btn-restart {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 1rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>מבחן הסמכה: תזמוני בדיקות תקופתיות בבטיחות בעבודה</h1>

    <div id="quiz-screen">

        </div>

        <div class="question-card">
            <div class="question-title" id="question-text">טוען שאלה...</div>
            <div class="options-list" id="options-container"></div>
        </div>

        <div id="feedback" class="feedback-area">
            <div class="feedback-title" id="feedback-title"></div>
            <div id="feedback-text"></div>
        </div>

        <button id="btn-next" class="btn-next" onclick="nextQuestion()">לשאלה הבאה</button>
    </div>

    <div id="summary-screen" class="summary-card">
        <h2>סיכום תוצאות המבחן</h2>
        <div class="summary-score" id="final-score">0%</div>
        <div class="summary-details" id="final-details"></div>
        <button class="btn-restart" onclick="restartQuiz()">התחל מבחן מחדש</button>
    </div>
</div>

        ],
        correct: 1,
        explanation: "מערכות יניקה ואוורור מלאכותי המיועדות לסילוק גורמים מזיקים/רעילים נבדקות בדיקת תקינות ויעילות אחת ל-12 חודשים."
    }
];

let currentQuestion = 0;
let score = 0;
let userAnswers = [];

function loadQuestion() {
    const q = quizData[currentQuestion];
    document.getElementById('question-count').innerText = `שאלה ${currentQuestion + 1} מתוך ${quizData.length}`;
    document.getElementById('question-text').innerText = q.question;
    
    const optionsContainer = document.getElementById('options-container');
    optionsContainer.innerHTML = '';

    q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt;
        btn.onclick = () => selectOption(idx);
        optionsContainer.appendChild(btn);
    });

    document.getElementById('feedback').style.display = 'none';
    document.getElementById('btn-next').style.display = 'none';
}

function selectOption(selectedIndex) {
    const q = quizData[currentQuestion];
    const buttons = document.querySelectorAll('.option-btn');
    
    buttons.forEach(btn => btn.disabled = true);

    const isCorrect = selectedIndex === q.correct;
    if (isCorrect) {
        score++;
        document.getElementById('current-score').innerText = `ניקוד: ${score}`;
    }

    userAnswers.push({
        question: q.question,
        selected: selectedIndex,
        correct: q.correct,
        isCorrect: isCorrect
    });

    // Visual styles for options
    buttons[selectedIndex].classList.add(isCorrect ? 'correct' : 'incorrect');
    if (!isCorrect) {
        buttons[q.correct].classList.add('correct');
    }

    // Feedback area
    const feedbackEl = document.getElementById('feedback');
    const feedbackTitle = document.getElementById('feedback-title');
    const feedbackText = document.getElementById('feedback-text');

    feedbackEl.style.display = 'block';
    if (isCorrect) {
        feedbackEl.className = 'feedback-area correct';
        feedbackTitle.innerText = 'תשובה נכונה!';
    } else {
        feedbackEl.className = 'feedback-area incorrect';
        feedbackTitle.innerText = `תשובה שגויה. התשובה הנכונה היא: ${q.options[q.correct]}`;
    }
    feedbackText.innerText = q.explanation;

    document.getElementById('btn-next').style.display = 'block';
}

function nextQuestion() {
    currentQuestion++;
    if (currentQuestion < quizData.length) {
        loadQuestion();
    } else {
        showSummary();
    }
}

function showSummary() {
    document.getElementById('quiz-screen').style.display = 'none';
    const summaryScreen = document.getElementById('summary-screen');
    summaryScreen.style.display = 'block';

    const percentage = Math.round((score / quizData.length) * 100);
    document.getElementById('final-score').innerText = `${percentage}%`;
    document.getElementById('final-details').innerText = 
        `ענית נכון על ${score} שאלות מתוך ${quizData.length} (תשובות שגויות: ${quizData.length - score}).`;
}

function restartQuiz() {
    currentQuestion = 0;
    score = 0;
    userAnswers = [];
    document.getElementById('current-score').innerText = `ניקוד: 0`;
    document.getElementById('summary-screen').style.display = 'none';
    document.getElementById('quiz-screen').style.display = 'block';
    loadQuestion();
}

// Start on load
loadQuestion();
</script>
