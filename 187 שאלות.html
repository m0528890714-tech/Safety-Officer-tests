<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>שאלון לממונה בטיחות</title>
    <style>
        :root {
            --primary-color: #0056b3;
            --secondary-color: #f4f7f6;
            --success-color: #28a745;
            --danger-color: #dc3545;
            --text-color: #333;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--secondary-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            direction: rtl;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 20px;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 10px;
        }

        .sticky-header {
            position: sticky;
            top: 0;
            background: var(--card-bg);
            padding: 10px 0;
            border-bottom: 1px solid #ddd;
            margin-bottom: 20px;
            z-index: 100;
        }

        .score-board {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 1.1em;
        }

        .progress-bar {
            width: 100%;
            background-color: #e0e0e0;
            border-radius: 10px;
            height: 12px;
            margin-top: 8px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            background-color: var(--primary-color);
            width: 0%;
            transition: width 0.3s ease;
        }

        .section-title {
            background-color: #e9ecef;
            padding: 10px 15px;
            border-radius: 6px;
            color: var(--primary-color);
            margin-top: 30px;
            margin-bottom: 15px;
            font-size: 1.3em;
            border-right: 5px solid var(--primary-color);
        }

        .question-card {
            background-color: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            transition: border-color 0.2s;
        }

        .question-text {
            font-weight: 600;
            font-size: 1.1em;
            margin-bottom: 15px;
            color: #222;
        }

        .options-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .option-item {
            padding: 12px 15px;
            margin-bottom: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            background-color: #fafafa;
        }

        .option-item:hover:not(.disabled) {
            background-color: #e2eafc;
            border-color: var(--primary-color);
        }

        .option-item.correct {
            background-color: #d4edda !important;
            border-color: var(--success-color) !important;
            color: #155724;
            font-weight: bold;
        }

        .option-item.incorrect {
            background-color: #f8d7da !important;
            border-color: var(--danger-color) !important;
            color: #721c24;
        }

        .disabled {
            cursor: default;
            opacity: 0.9;
        }

        .feedback {
            margin-top: 10px;
            font-weight: bold;
            display: none;
        }

        .feedback.correct-text {
            color: var(--success-color);
            display: block;
        }

        .feedback.incorrect-text {
            color: var(--danger-color);
            display: block;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .menu-btn {
            background: var(--card-bg);
            border: 2px solid var(--primary-color);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .menu-btn:hover {
            background: #e2eafc;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .menu-btn-title {
            font-size: 1.1em;
            font-weight: bold;
            color: var(--primary-color);
        }

        .menu-btn-score {
            font-size: 1.2em;
            color: #555;
            background: #eee;
            padding: 5px 15px;
            border-radius: 20px;
        }

        .back-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
            margin-bottom: 15px;
            transition: background 0.2s;
            display: inline-block;
        }

        .back-btn:hover {
            background-color: #004494;
        }

        .chunk-container {
            display: none;
        }

        .chunk-container.active {
            display: block;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 15px;
            }

            .score-board {
                flex-direction: column;
                gap: 5px;
                text-align: center;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>שאלון לממונה בטיחות</h1>

        <div id="main-menu" class="menu-grid">
            <!-- Menu buttons will be generated here -->
        </div>

        <div id="quiz-wrapper" style="display: none;">
            <button class="back-btn" onclick="showMenu()">חזור לתפריט הראשי</button>
            <div class="sticky-header">

                </div>
                <div class="progress-bar">
                    <div class="progress" id="progress-bar"></div>
                </div>
            </div>

            <div id="quiz-container"></div>
        </div>
    </div>

        let quizChunks = [];
        let testState = {};
        let currentChunkId = null;

        function initQuiz() {
            let chunkId = 0;
            quizData.forEach((sec) => {
                let tempChunk = [];
                let partNum = 1;
                sec.questions.forEach((q, idx) => {
                    tempChunk.push(q);
                    if (tempChunk.length === 26 || idx === sec.questions.length - 1) {
                        quizChunks.push({
                            id: chunkId,
                            sectionTitle: sec.section,
                            partNum: partNum++,
                            questions: [...tempChunk]
                        });
                        testState[chunkId] = {
                            answered: 0,
                            correct: 0,
                            total: tempChunk.length
                        };
                        chunkId++;
                        tempChunk = [];
                    }
                });
            });

            renderMenu();
            renderAllChunks();
        }

        function renderMenu() {
            const mainMenu = document.getElementById('main-menu');
            mainMenu.innerHTML = '';

            quizChunks.forEach(chunk => {
                const state = testState[chunk.id];
                const scorePct = state.answered > 0 ? Math.round((state.correct / state.answered) * 100) : 0;

                const btn = document.createElement('div');
                btn.className = 'menu-btn';
                btn.onclick = () => startTest(chunk.id);

                btn.innerHTML = `
            <div class="menu-btn-title">${chunk.sectionTitle}</div>
            <div>חלק ${chunk.partNum} (${chunk.questions.length} שאלות)</div>
            <div class="menu-btn-score" id="menu-score-${chunk.id}">ציון: ${scorePct}% (${state.answered}/${state.total})</div>
        `;
                mainMenu.appendChild(btn);
            });
        }

        function renderAllChunks() {
            const quizContainer = document.getElementById('quiz-container');
            quizContainer.innerHTML = '';

            quizChunks.forEach((chunk) => {
                const chunkDiv = document.createElement('div');
                chunkDiv.className = 'chunk-container';
                chunkDiv.id = `chunk-${chunk.id}`;

                const secTitle = document.createElement('div');
                secTitle.className = 'section-title';
                secTitle.innerText = `${chunk.sectionTitle} - חלק ${chunk.partNum}`;
                chunkDiv.appendChild(secTitle);

                chunk.questions.forEach((q) => {
                    const qCard = document.createElement('div');
                    qCard.className = 'question-card';
                    qCard.id = `q-card-${q.id}`;

                    const qText = document.createElement('div');
                    qText.className = 'question-text';
                    qText.innerText = q.text;
                    qCard.appendChild(qText);

                    const optionsList = document.createElement('ul');
                    optionsList.className = 'options-list';

                    let shuffledOptions = q.options.map((opt, idx) => {
                        let cleanText = opt.replace(/^[א-ת][\.\-]?\s*/, '');
                        return { originalIdx: idx, text: cleanText };
                    });

                    for (let i = shuffledOptions.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [shuffledOptions[i], shuffledOptions[j]] = [shuffledOptions[j], shuffledOptions[i]];
                    }

                    let newCorrectIdx = shuffledOptions.findIndex(o => o.originalIdx === q.correct);
                    const prefixes = ['א. ', 'ב. ', 'ג. ', 'ד. ', 'ה. ', 'ו. '];

                    shuffledOptions.forEach((optObj, optIdx) => {
                        const optItem = document.createElement('li');
                        optItem.className = 'option-item';
                        optItem.innerText = (prefixes[optIdx] || '') + optObj.text;
                        optItem.onclick = () => checkAnswer(chunk.id, q.id, optIdx, newCorrectIdx);
                        optionsList.appendChild(optItem);
                    });

                    qCard.appendChild(optionsList);

                    const feedback = document.createElement('div');
                    feedback.className = 'feedback';
                    feedback.id = `feedback-${q.id}`;
                    qCard.appendChild(feedback);

                    chunkDiv.appendChild(qCard);
                });

                quizContainer.appendChild(chunkDiv);
            });
        }

        function showMenu() {
            document.getElementById('quiz-wrapper').style.display = 'none';
            document.getElementById('main-menu').style.display = 'grid';

            quizChunks.forEach(chunk => {
                const state = testState[chunk.id];
                const scorePct = state.answered > 0 ? Math.round((state.correct / state.answered) * 100) : 0;
                const scoreEl = document.getElementById(`menu-score-${chunk.id}`);
                if (scoreEl) {
                    scoreEl.innerText = `ציון: ${scorePct}% (${state.answered}/${state.total})`;
                }
            });

            currentChunkId = null;
        }

        function startTest(chunkId) {
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('quiz-wrapper').style.display = 'block';

            document.querySelectorAll('.chunk-container').forEach(el => el.classList.remove('active'));
            document.getElementById(`chunk-${chunkId}`).classList.add('active');

            currentChunkId = chunkId;
            updateScoreBoard();
        }

        function checkAnswer(chunkId, questionId, selectedIdx, correctIdx) {
            const qCard = document.getElementById(`q-card-${questionId}`);
            const options = qCard.querySelectorAll('.option-item');
            const feedback = document.getElementById(`feedback-${questionId}`);

            if (options[0].classList.contains('disabled')) return;

            const state = testState[chunkId];
            state.answered++;

            options.forEach((opt, idx) => {
                opt.classList.add('disabled');
                if (idx === correctIdx) {
                    opt.classList.add('correct');
                }
                if (idx === selectedIdx && selectedIdx !== correctIdx) {
                    opt.classList.add('incorrect');
                }
            });

            if (selectedIdx === correctIdx) {
                state.correct++;
                feedback.innerText = "תשובה נכונה! כל הכבוד.";
                feedback.className = "feedback correct-text";
            } else {
                feedback.innerText = "תשובה שגויה. התשובה הנכונה מסומנת בירוק.";
                feedback.className = "feedback incorrect-text";
            }

            updateScoreBoard();
        }

        function updateScoreBoard() {
            if (currentChunkId === null) return;
            const state = testState[currentChunkId];

            document.getElementById('answered-count').innerText = state.answered;
            document.getElementById('total-count').innerText = state.total;

            const scorePct = state.answered > 0 ? Math.round((state.correct / state.answered) * 100) : 0;
            document.getElementById('score-val').innerText = scorePct;

            const progressPct = Math.round((state.answered / state.total) * 100);
            document.getElementById('progress-bar').style.width = `${progressPct}%`;
        }

        window.onload = initQuiz;
    </script>
