<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>

    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Assistant', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
        }
        .option-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .option-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.15);
        }
        .correct-anim {
            animation: pulse-green 0.4s ease-in-out;
        }
        @keyframes pulse-green {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body class="text-slate-100 flex items-center justify-center p-4 md:p-8 min-h-screen">

                <div class="w-1/3 bg-slate-700 h-2 rounded-full overflow-hidden hidden sm:block">

                    <span class="text-xs text-slate-400">ניקוד מצטבר:</span>
                    <span id="score" class="text-lg font-bold text-emerald-400">0</span>

            </div>

            <!-- Quiz Interactive View -->
            <div id="quiz-content" class="space-y-6">

                    <h2 id="question-text" class="text-lg md:text-xl font-bold text-slate-100 leading-relaxed">

                    </h2>
                </div>

                </div>

                    <div id="feedback-source" class="text-xs font-semibold px-3 py-1.5 rounded-lg bg-slate-900/60 text-slate-400 inline-block border border-slate-700/50"></div>

            },
            {
                q: "איזה מבין הגורמים הבאים מוסמך להורות על ביצוע הדרכה מיוחדת במקום העבודה מעבר לשגרה?",
                options: [
                    "א. מפקח עבודה ראשי או מפקח עבודה אזורי",
                    "ב. יו\"ר ועד העובדים בלבד",
                    "ג. רופא משפחה של אחד העובדים",
                    "ד. כל עובד בעל ותק של שנה"
                ],
                correct: 0,
                source: "סמכויות מפקח עבודה: מפקח עבודה רשאי לדרוש מהמחזיק לקיים הדרכות מיוחדות/חוזרות במידה ונוכח כי קיימים ליקויי בטיחות."
            },
            {
                q: "כיצד מגדירות התקנות מסירת מידע לגבי חומרים מסוכנים חדשים שהוכנסו למפעל?",
                options: [
                    "א. יש למסור מידע רק לאחר 30 ימי שימוש בחומר",
                    "ב. חובה למסור מידע ולהדריך את העובדים בטרם התחלת השימוש בחומר החדש",
                    "ג. המידע יימסר רק במידה והתרחשה דליפה או פגיעה בחומר",
                    "ד. מספיק להדביק מדבקה קטנה על האריזה ללא צורך במסירת מידע לצוות"
                ],
                correct: 1,
                source: "תקנה 2 ותקנה 5: חובת מסירת מידע וגיליונות בטיחות (SDS) קודם לחשיפה ולשימוש בחומרים המסוכנים."
            },
            {
                q: "מה נדרש לעשות כאשר במקום עבודה מעורבים עובדים הדוברים שפות שונות (כגון עובדים זרים)?",
                options: [
                    "א. לחייב את העובדים ללמוד עברית תוך 14 יום",
                    "ב. לספק תרגום של המידע וההדרכה לשפות המובנות לכל קבוצת עובדים",
                    "ג. להשתמש בשפת הסימנים בלבד בהדרכות פרונטליות",
                    "ד. לפטור עובדים זרים מהדרכת בטיחות בשל קשיי שפה"
                ],
                correct: 1,
                source: "תקנה 3(ג): חובה מפורשת להעביר הדרכה בשפה המובנת לעובד, כולל תרגום חומרי הדרכה ותמציות בטיחות בכתב."
            },
            {
                q: "חובת תליית שלטי אזהרה והוראות בטיחות במפעל חלה על מנת לקדם מה מבין הבאים?",
                options: [
                    "א. יצירת מראה אסתטי ומודרני למבנה המפעל",
                    "ב. הנגשת מידע זמין ואינטנסיבי בקרבת גורמי הסיכון ביומיום",
                    "ג. הוכחה בלעדית עבור חברות הביטוח בלבד",
                    "ד. заменя התקנת ציוד מגן אישי"
                ],
                correct: 1,
                source: "תקנה 4: שלטי האזהרה והוראות הבטיחות נועדו להזהיר באופן ישיר ומתמיד מפני הסיכונים הספציפיים הנמצאים במיקום השלט."
            },
            {
                q: "האם מותר למעסיק לערוך הדרכת בטיחות באמצעות למידה מתוקשבת (ממוחשבת) לפי הנחיות מפקח עבודה ראשי?",
                options: [
                    "א. אסור באופן מוחלט, כל הדרכה חייבת להיות פרונטלית בכיתה בלבד",
                    "ב. מותר, בלבד שהמערכת מאושרת, מאפשרת בדיקת הבנה ומאושרת לפי ההנחיות",
                    "ג. מותר רק לעובדי מנהלה ולא לעובדי ייצור או שטח",
                    "ד. מותר רק אם ההדרכה נמשכת פחות מ-10 דקות"
                ],
                correct: 1,
                source: "הנחיות מפקח עבודה ראשי (מכוח תקנה 3): מותרת הדרכה מתוקשבת בתנאי שהלמידה כוללת אימות זהות, בדיקת הבנה ורישום כנדרש."
            }
        ];

        let currentIdx = 0;
        let score = 0;
        let correctCount = 0;
        let wrongCount = 0;

        function initQuiz() {
            renderQuestion();
        }

        function renderQuestion() {
            const q = questions[currentIdx];
            document.getElementById('current-idx').innerText = currentIdx + 1;
            document.getElementById('question-text').innerText = q.q;
            
            // Update progress bar
            const progressPct = ((currentIdx) / questions.length) * 100;
            document.getElementById('progress-bar').style.width = `${progressPct}%`;

            // Reset feedback
            const feedbackDiv = document.getElementById('feedback');
            feedbackDiv.classList.add('hidden');
            
            const grid = document.getElementById('options-grid');
            grid.innerHTML = '';
            
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "option-btn w-full text-right p-4 rounded-xl font-semibold border text-slate-200 border-slate-700/80 bg-slate-800/60 hover:bg-slate-700/80 hover:border-slate-500 focus:outline-none";
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(idx);
                grid.appendChild(btn);
            });
        }

        function checkAnswer(selectedIdx) {
            const q = questions[currentIdx];
            const btns = document.querySelectorAll('.option-btn');
            
            // Disable all option buttons
            btns.forEach(btn => btn.disabled = true);
            
            const feedbackDiv = document.getElementById('feedback');
            const feedbackTitle = document.getElementById('feedback-title');
            const feedbackMsg = document.getElementById('feedback-msg');
            const feedbackIcon = document.getElementById('feedback-icon');
            const feedbackSource = document.getElementById('feedback-source');
            
            feedbackDiv.classList.remove('hidden');
            
            if (selectedIdx === q.correct) {
                btns[selectedIdx].className = "option-btn correct-anim w-full text-right p-4 rounded-xl font-bold border border-emerald-500 bg-emerald-950/80 text-emerald-200";
                score += 5;
                correctCount++;
                feedbackIcon.innerText = "✅";
                feedbackTitle.innerText = "תשובה נכונה מאוד!";
                feedbackTitle.className = "font-bold text-lg text-emerald-400";
                feedbackDiv.className = "p-5 rounded-xl border border-emerald-500/40 bg-emerald-950/30";
                feedbackMsg.innerText = "ביצעת בחירה מדויקת בהתאם לדרישות התקנות.";
            } else {
                btns[selectedIdx].className = "option-btn w-full text-right p-4 rounded-xl font-bold border border-rose-500 bg-rose-950/80 text-rose-200";
                btns[q.correct].className = "option-btn w-full text-right p-4 rounded-xl font-bold border border-emerald-500 bg-emerald-950/40 text-emerald-300";
                wrongCount++;
                feedbackIcon.innerText = "❌";
                feedbackTitle.innerText = "תשובה שגויה";
                feedbackTitle.className = "font-bold text-lg text-rose-400";
                feedbackDiv.className = "p-5 rounded-xl border border-rose-500/40 bg-rose-950/30";
                feedbackMsg.innerHTML = `<span class="font-bold text-slate-200">התשובה הנכונה היא:</span> ${q.options[q.correct]}`;
            }
            
            feedbackSource.innerText = q.source;
            document.getElementById('score').innerText = score;
        }

        function nextQuestion() {
            currentIdx++;
            if (currentIdx < questions.length) {
                renderQuestion();
            } else {
                showFinal();
            }
        }

        function showFinal() {
            document.getElementById('quiz-content').classList.add('hidden');
            document.getElementById('stats-bar').classList.add('hidden');
            
            const finalScreen = document.getElementById('final-screen');
            finalScreen.classList.remove('hidden');
            
            const percent = Math.round((correctCount / questions.length) * 100);
            document.getElementById('final-percent').innerText = percent + "%";
            document.getElementById('final-stats').innerText = `תשובות נכונות: ${correctCount} | תשובות שגויות: ${wrongCount}`;

            const evalDiv = document.getElementById('final-evaluation');
            if (percent >= 80) {
                evalDiv.innerHTML = `<p class="text-emerald-400 font-bold text-lg mb-1">כל הכבוד! עברת את המבחן בהצלחה רבה!</p><p class="text-slate-400">יש לך שליטה מעולה בתקנות מסירת מידע והדרכת עובדים.</p>`;
            } else if (percent >= 60) {
                evalDiv.innerHTML = `<p class="text-amber-400 font-bold text-lg mb-1">עברת את המבחן, אך מומלץ לרענן נושאים נוספים.</p><p class="text-slate-400">סקור את הסעיפים שבהם טעית על מנת להבטיח בקיאות מלאה.</p>`;
            } else {
                evalDiv.innerHTML = `<p class="text-rose-400 font-bold text-lg mb-1">לא עברת את ציון הסף להסמכה.</p><p class="text-slate-400">מומלץ לקרוא בעיון את תקנות ארגון הפיקוח על העבודה ולנסות שוב.</p>`;
            }
        }

        window.onload = initQuiz;
    </script>
