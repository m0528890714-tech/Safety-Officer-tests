<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מבחן הסמכה: תכנית לניהול בטיחות (התשע"ג-2013)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Assistant', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
        }
        .option-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .option-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.15);
        }
        .correct-anim {
            animation: pulse-green 0.4s ease-in-out;
        }
        @keyframes pulse-green {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body class="text-slate-100 flex items-center justify-center p-4 md:p-8 min-h-screen">

    <div class="w-full max-w-3xl bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl overflow-hidden my-auto">
        <!-- Header -->
        <header class="bg-slate-800/80 border-b border-slate-700/60 p-6 text-center relative">
            <span class="inline-block px-3 py-1 bg-blue-500/10 text-blue-400 border border-blue-500/20 text-xs font-semibold rounded-full mb-2">
                תקנות ארגון הפיקוח על העבודה
            </span>
            <h1 class="text-2xl md:text-3xl font-extrabold text-white tracking-wide">

        <!-- Main Body -->
        <div class="p-6 md:p-8">
            <!-- Progress Bar & Status -->
            <div id="stats-bar" class="flex justify-between items-center mb-6 bg-slate-800/40 p-4 rounded-xl border border-slate-800">
                <div class="flex items-center space-x-2 space-x-reverse">
                    <span class="text-xs text-slate-400">שאלה:</span>
                    <span id="current-idx" class="text-lg font-bold text-blue-400">1</span>
                    <span class="text-xs text-slate-500">/ 20</span>
                </div>
                <!-- Progress track -->
                <div class="w-1/3 bg-slate-700 h-2 rounded-full overflow-hidden hidden sm:block">
                    <div id="progress-bar" class="bg-blue-500 h-full transition-all duration-300 w-0"></div>
                </div>
                <div class="flex items-center space-x-2 space-x-reverse">
                    <span class="text-xs text-slate-400">ניקוד מצטבר:</span>
                    <span id="score" class="text-lg font-bold text-emerald-400">0</span>
                </div>
            </div>

            <!-- Quiz Interactive View -->
            <div id="quiz-content" class="space-y-6">
                <div class="bg-slate-800/30 p-5 rounded-xl border border-slate-700/50">
                    <h2 id="question-text" class="text-lg md:text-xl font-bold text-slate-100 leading-relaxed">
                        <!-- שאלה תוזן כאן -->
                    </h2>
                </div>

                <div id="options-grid" class="grid grid-cols-1 gap-3">
                    <!-- תשובות יוזנו דינמית -->
                </div>

                <!-- Feedback Panel -->
                <div id="feedback" class="hidden p-5 rounded-xl border transition-all duration-300">
                    <div class="flex items-center gap-2 mb-2">
                        <span id="feedback-icon" class="text-xl"></span>
                        <h3 id="feedback-title" class="font-bold text-lg"></h3>
                    </div>
                    <p id="feedback-msg" class="text-sm leading-relaxed text-slate-300 mb-3"></p>
                    <div id="feedback-source" class="text-xs font-semibold px-3 py-1.5 rounded-lg bg-slate-900/60 text-slate-400 inline-block border border-slate-700/50"></div>
                    
                    <button id="next-btn" onclick="nextQuestion()" class="mt-5 w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-6 rounded-xl shadow-lg transition duration-200">

                </div>
            </div>

            <!-- Final Results View -->
            <div id="final-screen" class="hidden text-center py-8 space-y-6">

                    התחל מבחן מחדש
                </button>
            </div>
        </div>
    </div>

                options: [
                    "א. מקומות עבודה שנכללו בהודעה שפרסם השר ברשומות (כגון סוגי מוסדות או אתרים מסוימים)",
                    "ב. כל חנות קמעונאית המשתרעת על פני יותר מ-100 מ\"ר",
                    "ג. כל משרד המעסיק מעל 5 עובדי מנהלה",

                source: "תקנה 2(א)(2): חובת הכנת תכנית חלה גם על מקום עבודה הנמנה עם סוג מקומות עבודה שקבע השר בהודעה שפורסמה ברשומות."

        let currentIdx = 0;
        let score = 0;
        let correctCount = 0;
        let wrongCount = 0;

        function initQuiz() {
            renderQuestion();
        }

        function renderQuestion() {
            const q = questions[currentIdx];
            document.getElementById('current-idx').innerText = currentIdx + 1;
            document.getElementById('question-text').innerText = q.q;
            
            // Update progress bar
            const progressPct = ((currentIdx) / questions.length) * 100;
            document.getElementById('progress-bar').style.width = `${progressPct}%`;

            // Reset feedback
            const feedbackDiv = document.getElementById('feedback');
            feedbackDiv.classList.add('hidden');
            
            const grid = document.getElementById('options-grid');
            grid.innerHTML = '';
            
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "option-btn w-full text-right p-4 rounded-xl font-semibold border text-slate-200 border-slate-700/80 bg-slate-800/60 hover:bg-slate-700/80 hover:border-slate-500 focus:outline-none";
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(idx);
                grid.appendChild(btn);
            });
        }

        function checkAnswer(selectedIdx) {
            const q = questions[currentIdx];
            const btns = document.querySelectorAll('.option-btn');
            
            // Disable all option buttons
            btns.forEach(btn => btn.disabled = true);
            
            const feedbackDiv = document.getElementById('feedback');
            const feedbackTitle = document.getElementById('feedback-title');
            const feedbackMsg = document.getElementById('feedback-msg');
            const feedbackIcon = document.getElementById('feedback-icon');
            const feedbackSource = document.getElementById('feedback-source');
            
            feedbackDiv.classList.remove('hidden');
            
            if (selectedIdx === q.correct) {
                btns[selectedIdx].className = "option-btn correct-anim w-full text-right p-4 rounded-xl font-bold border border-emerald-500 bg-emerald-950/80 text-emerald-200";
                score += 5;
                correctCount++;
                feedbackIcon.innerText = "✅";
                feedbackTitle.innerText = "תשובה נכונה מאוד!";
                feedbackTitle.className = "font-bold text-lg text-emerald-400";
                feedbackDiv.className = "p-5 rounded-xl border border-emerald-500/40 bg-emerald-950/30";
                feedbackMsg.innerText = "ביצעת בחירה מדויקת בהתאם לדרישות תקנות תכנית לניהול הבטיחות.";
            } else {
                btns[selectedIdx].className = "option-btn w-full text-right p-4 rounded-xl font-bold border border-rose-500 bg-rose-950/80 text-rose-200";
                btns[q.correct].className = "option-btn w-full text-right p-4 rounded-xl font-bold border border-emerald-500 bg-emerald-950/40 text-emerald-300";
                wrongCount++;
                feedbackIcon.innerText = "❌";
                feedbackTitle.innerText = "תשובה שגויה";
                feedbackTitle.className = "font-bold text-lg text-rose-400";
                feedbackDiv.className = "p-5 rounded-xl border border-rose-500/40 bg-rose-950/30";
                feedbackMsg.innerHTML = `<span class="font-bold text-slate-200">התשובה הנכונה היא:</span> ${q.options[q.correct]}`;
            }
            
            feedbackSource.innerText = q.source;
            document.getElementById('score').innerText = score;
        }

        function nextQuestion() {
            currentIdx++;
            if (currentIdx < questions.length) {
                renderQuestion();
            } else {
                showFinal();
            }
        }

        function showFinal() {
            document.getElementById('quiz-content').classList.add('hidden');
            document.getElementById('stats-bar').classList.add('hidden');
            
            const finalScreen = document.getElementById('final-screen');
            finalScreen.classList.remove('hidden');
            
            const percent = Math.round((correctCount / questions.length) * 100);
            document.getElementById('final-percent').innerText = percent + "%";
            document.getElementById('final-stats').innerText = `תשובות נכונות: ${correctCount} | תשובות שגויות: ${wrongCount}`;

            const evalDiv = document.getElementById('final-evaluation');
            if (percent >= 80) {
                evalDiv.innerHTML = `<p class="text-emerald-400 font-bold text-lg mb-1">כל הכבוד! עברת את המבחן בהצלחה רבה!</p><p class="text-slate-400">יש לך שליטה מצוינת בתקנות תכנית לניהול הבטיחות (2013).</p>`;
            } else if (percent >= 60) {
                evalDiv.innerHTML = `<p class="text-amber-400 font-bold text-lg mb-1">עברת את המבחן, אך מומלץ לרענן נושאים נוספים.</p><p class="text-slate-400">סקור את סעיפי התקנות והתוספת שבהם טעית על מנת להבטיח בקיאות מלאה.</p>`;
            } else {
                evalDiv.innerHTML = `<p class="text-rose-400 font-bold text-lg mb-1">לא עברת את ציון הסף להסמכה.</p><p class="text-slate-400">מומלץ לקרוא בעיון את תקנות ארגון הפיקוח על העבודה (תכנית לניהול הבטיחות) ולנסות שוב.</p>`;
            }
        }

        window.onload = initQuiz;
    </script>
