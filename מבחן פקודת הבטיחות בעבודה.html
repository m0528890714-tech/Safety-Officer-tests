<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Assistant', sans-serif;
            background-color: #0f172a;
        }
        .card-gradient {
            background: linear-gradient(145deg, #1e293b, #0f172a);
        }
        .progress-transition {
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="text-slate-200 min-h-screen flex flex-col items-center p-4 md:p-10">

    <div class="w-full max-w-4xl">
        <header class="text-center mb-10">
            <h1 class="text-3xl md:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400 mb-4">
                מבחן פקודת הבטיחות בעבודה
            </h1>
            <p class="text-slate-400 text-lg">נוסח חדש, תש"ל-1970 | בחינת בקיאות מקצועית</p>
        </header>

        <!-- Main Quiz Container -->
        <div id="quiz-container" class="card-gradient border border-slate-800 rounded-3xl shadow-2xl overflow-hidden min-h-[500px] flex flex-col">
            
            <!-- Progress Bar -->
            <div class="h-2 bg-slate-800 w-full">
                <div id="progress-bar" class="h-full bg-blue-500 progress-transition w-0"></div>
            </div>

            <!-- Quiz Content -->
            <div id="quiz-content" class="p-6 md:p-10 flex-grow">
                <!-- Status Row -->
                <div class="flex justify-between items-center mb-8">
                    <div class="px-4 py-1 bg-slate-800 rounded-full text-sm font-semibold border border-slate-700">
                        שאלה <span id="current-q-num">1</span> מתוך 20
                    </div>
                    <div class="text-emerald-400 font-bold">
                        ניקוד: <span id="current-score">0</span>
                    </div>
                </div>

                <!-- Question Area -->
                <div id="question-area" class="fade-in">
                    <h2 id="question-text" class="text-xl md:text-2xl font-bold mb-8 leading-tight">
                        טוען שאלה...
                    </h2>

                    <!-- Options -->
                    <div id="options-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <!-- Options will be injected here -->
                    </div>
                </div>

                <!-- Feedback Area (Hidden by default) -->
                <div id="feedback-area" class="hidden mt-8 p-6 rounded-2xl border fade-in">
                    <div class="flex items-start gap-4">
                        <div id="feedback-icon" class="text-3xl"></div>
                        <div>
                            <h3 id="feedback-title" class="font-bold text-lg mb-1"></h3>
                            <p id="feedback-text" class="text-slate-300 mb-3"></p>
                            <div class="inline-block px-3 py-1 bg-slate-900 rounded-lg text-xs font-mono text-blue-400 border border-slate-700" id="source-tag">
                                סעיף בחוק
                            </div>
                        </div>
                    </div>
                    <button onclick="handleNext()" class="mt-6 w-full md:w-auto px-8 py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl transition shadow-lg">
                        המשך לשאלה הבאה
                    </button>
                </div>
            </div>

            <!-- Result Screen (Hidden by default) -->
            <div id="result-screen" class="hidden p-10 text-center fade-in">
                <div class="mb-6">
                    <div id="final-medal" class="text-6xl mb-4">🏆</div>
                    <h2 class="text-4xl font-bold mb-2">סיכום המבחן</h2>
                </div>
                
                <div class="grid grid-cols-2 gap-4 max-w-sm mx-auto mb-8">
                    <div class="bg-emerald-500/10 border border-emerald-500/20 p-4 rounded-2xl">
                        <div class="text-emerald-400 text-sm font-bold uppercase">נכונות</div>
                        <div id="correct-count" class="text-3xl font-bold">0</div>
                    </div>
                    <div class="bg-rose-500/10 border border-rose-500/20 p-4 rounded-2xl">
                        <div class="text-rose-400 text-sm font-bold uppercase">שגויות</div>
                        <div id="wrong-count" class="text-3xl font-bold">0</div>
                    </div>
                </div>

                <div class="text-6xl font-black text-blue-400 mb-8" id="final-percentage">0%</div>
                
                <p id="final-evaluation" class="text-slate-400 mb-10 max-w-md mx-auto"></p>

                <button onclick="location.reload()" class="px-10 py-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold rounded-2xl shadow-xl transition transform hover:scale-105">
                    בצע מבחן חוזר
                </button>
            </div>
        </div>
    </div>

        let currentQuestion = 0;
        let score = 0;
        let correctAnswersCount = 0;
        let wrongAnswersCount = 0;

        function loadQuestion() {
            const data = quizData[currentQuestion];
            document.getElementById('current-q-num').innerText = currentQuestion + 1;
            document.getElementById('question-text').innerText = data.q;
            
            const optionsGrid = document.getElementById('options-grid');
            optionsGrid.innerHTML = '';
            
            data.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = "text-right p-4 rounded-2xl border border-slate-700 bg-slate-800/40 hover:bg-slate-700/60 hover:border-blue-500 transition-all duration-200 fade-in font-medium";
                btn.innerText = opt;
                btn.onclick = () => selectOption(index);
                optionsGrid.appendChild(btn);
            });

            // Update Progress
            const progress = ((currentQuestion) / quizData.length) * 100;
            document.getElementById('progress-bar').style.width = `${progress}%`;
            
            document.getElementById('feedback-area').classList.add('hidden');
            document.getElementById('question-area').classList.remove('hidden');
        }

        function selectOption(index) {
            const data = quizData[currentQuestion];
            const isCorrect = (index === data.correct);
            
            const feedbackArea = document.getElementById('feedback-area');
            const feedbackIcon = document.getElementById('feedback-icon');
            const feedbackTitle = document.getElementById('feedback-title');
            const feedbackText = document.getElementById('feedback-text');
            const sourceTag = document.getElementById('source-tag');
            const optionsGrid = document.getElementById('options-grid');

            // Disable all buttons
            Array.from(optionsGrid.children).forEach((btn, idx) => {
                btn.disabled = true;
                if(idx === data.correct) {
                    btn.classList.add('border-emerald-500', 'bg-emerald-500/10', 'text-emerald-400');
                } else if(idx === index && !isCorrect) {
                    btn.classList.add('border-rose-500', 'bg-rose-500/10', 'text-rose-400');
                }
            });

            if (isCorrect) {
                score += 5;
                correctAnswersCount++;
                feedbackIcon.innerText = "✅";
                feedbackTitle.innerText = "נכון מאוד!";
                feedbackTitle.className = "font-bold text-lg mb-1 text-emerald-400";
                feedbackArea.className = "mt-8 p-6 rounded-2xl border border-emerald-500/30 bg-emerald-500/5 fade-in";
                feedbackText.innerText = "תשובה מדויקת. הבנת החוק שלך מצוינת.";
            } else {
                wrongAnswersCount++;
                feedbackIcon.innerText = "❌";
                feedbackTitle.innerText = "לא מדויק...";
                feedbackTitle.className = "font-bold text-lg mb-1 text-rose-400";
                feedbackArea.className = "mt-8 p-6 rounded-2xl border border-rose-500/30 bg-rose-500/5 fade-in";
                feedbackText.innerText = `התשובה הנכונה היא: ${data.options[data.correct]}`;
            }

            sourceTag.innerText = data.source;
            document.getElementById('current-score').innerText = score;
            feedbackArea.classList.remove('hidden');
        }

        function handleNext() {
            currentQuestion++;
            if (currentQuestion < quizData.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('quiz-content').classList.add('hidden');
            document.getElementById('progress-bar').style.width = '100%';
            
            const resultScreen = document.getElementById('result-screen');
            resultScreen.classList.remove('hidden');
            
            document.getElementById('correct-count').innerText = correctAnswersCount;
            document.getElementById('wrong-count').innerText = wrongAnswersCount;
            
            const percentage = (correctAnswersCount / quizData.length) * 100;
            document.getElementById('final-percentage').innerText = `${percentage}%`;
            
            const eval = document.getElementById('final-evaluation');
            const medal = document.getElementById('final-medal');
            
            if (percentage >= 90) {
                medal.innerText = "🥇";
                eval.innerText = "מדהים! אתה בקיא ברמה של מפקח עבודה בכיר. כל הכבוד על הידע המעמיק בפקודת הבטיחות.";
            } else if (percentage >= 70) {
                medal.innerText = "🥈";
                eval.innerText = "תוצאה טובה מאוד. יש לך הבנה מוצקה של דרישות החוק, עם מקום קטן לשיפור בסעיפים הטכניים.";
            } else if (percentage >= 50) {
                medal.innerText = "🥉";
                eval.innerText = "עברת את המבחן, אך מומלץ לחזור ולעבור על סעיפי הבדיקות התקופתיות והגידור הבטוח.";
            } else {
                medal.innerText = "⚠️";
                eval.innerText = "התוצאה נמוכה מהמצופה. בטיחות בעבודה היא נושא קריטי - מומלץ לקרוא את הפקודה בעיון ולנסות שוב.";
            }
        }

        // Initialize
        window.onload = loadQuestion;
    </script>
</body>
</html>
